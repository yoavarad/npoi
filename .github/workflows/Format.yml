name: Format

# Standalone (not NUKE-generated): per-OS format jobs, so it does not
# fit the CI/PR matrix in build/Build.GitHubAction.cs and needs no regeneration.
# Line endings follow git (.gitattributes text=auto), so the check runs on both OSes.

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0
      - name: Format check
        run: dotnet format solution/NPOI.Core.Test.sln --verify-no-changes
  format-ubuntu:
    name: format (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0
      - name: Format check
        run: dotnet format solution/NPOI.Core.Test.sln --verify-no-changes
